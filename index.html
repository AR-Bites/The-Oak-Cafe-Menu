                description: { en: 'Sweet endings to your perfect meal', ar: 'نهايات حلوة لوجبتك المثالية' },
                items: [
                    {
                        name: { en: 'Chocolate Cake', ar: 'كيكة الشوكولاتة' },
                        description: { en: 'Rich chocolate layer cake', ar: 'كيكة شوكولاتة غنية بالطبقات' },
                        price: 4.50,
                        model: null,
                        icon: 'birthday-cake'
                    },
                    {
                        name: { en: 'Tiramisu', ar: 'تيراميسو' },
                        description: { en: 'Classic Italian tiramisu', ar: 'تيراميسو إيطالي كلاسيكي' },
                        price: 5.25,
                        model: null,
                        icon: 'ice-cream'
                    }
                ]
            }
        };

        // Available 3D models (verified from actual directory)
        const availableModels = [
            'beefBurger.glb', 'beefFahita.glb', 'celezone.glb', 'cheeseSteakSandwich.glb',
            'chickenDynamiteSalad.glb', 'chickenFajita.glb', 'chickenQuesadilla.glb', 'chickenShawerma.glb',
            'chickenTender.glb', 'chickenZingerSandwich.glb', 'crispyChickenBurger.glb', 'dynamiteShrimp.glb',
            'Fettuccine Alfredo.glb', 'foodPlatter_.glb', 'grilledChicken.glb', 'hallomi.glb',
            'hallomiSalad.glb', 'halloumiSandwich_.glb', 'hashBrown.glb', 'macAndCheese.glb',
            'Margherita Pizza.glb', 'mozzerellaSticks_.glb', 'onionRings_.glb', 'pennaArabita_.glb',
            'Pepperoni Pizza.glb', 'pestoChickenPizza.glb', 'Pesto Pasta.glb',
            'Rose Pasta.glb', 'seaFoodBowl_.glb', 'Sea Food Pasta.glb', 'smokedSalmonSalad.glb',
            'Steak.glb', 'tacoSalad.glb', 'waffleSalad.glb', 'yalanji.glb'
        ];

        let currentLanguage = 'en';
        const modelCache = new Set();

        // Language switching function
        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.querySelectorAll('.lang-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update body direction for RTL
            document.body.classList.toggle('rtl', lang === 'ar');
            
            // Re-render content and update navigation
            renderMenuContent();
            updateNavigationText();
        }

        // Update navigation text based on current language
        function updateNavigationText() {
            document.querySelectorAll('.category-link span').forEach(span => {
                const text = span.getAttribute(`data-${currentLanguage}`);
                if (text) span.textContent = text;
            });
        }

        // Preload 3D models for performance
        function preloadModels() {
            console.log('🔄 Preloading 3D models...');
            const hiddenContainer = document.createElement('div');
            hiddenContainer.style.display = 'none';
            document.body.appendChild(hiddenContainer);
            
            availableModels.forEach(modelName => {
                const viewer = document.createElement('model-viewer');
                viewer.setAttribute('src', `models/${modelName}`);
                viewer.setAttribute('preload', '');
                viewer.addEventListener('load', () => {
                    modelCache.add(modelName);
                    console.log(`✅ Cached: ${modelName}`);
                });
                hiddenContainer.appendChild(viewer);
            });
        }

        // Create menu item card (Bootstrap structure)
        function createMenuItemCard(item, index) {
            const hasModel = item.model && item.model.length > 0;
            const modelSrc = hasModel ? `models/${item.model}` : null;
            
            return `
                <div class="col-lg-3 col-md-4 col-sm-6 col-12">
                    <div class="menu-item-card" style="animation-delay: ${index * 0.1}s">
                        <div class="model-display">
                            ${hasModel ? 
                                `<model-viewer 
                                    src="${modelSrc}" 
                                    alt="${item.name[currentLanguage]}"
                                    auto-rotate 
                                    camera-controls 
                                    loading="lazy"
                                    ar
                                    ar-modes="webxr scene-viewer quick-look">
                                    <div class="loading-overlay"></div>
                                </model-viewer>` :
                                `<div class="model-placeholder">
                                    <i class="fas fa-${item.icon}"></i>
                                </div>`
                            }
                        </div>
                        <div class="card-body">
                            <div class="item-header">
                                <h5 class="item-title">${item.name[currentLanguage]}</h5>
                                <span class="item-price">${item.price.toFixed(2)} JOD</span>
                            </div>
                            <p class="item-description">${item.description[currentLanguage]}</p>
                            ${hasModel ? '<div class="model-badge"><i class="fas fa-cube"></i> 3D Model</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render menu content with Bootstrap grid
        function renderMenuContent() {
            console.log('📋 Rendering menu content...');
            const menuContainer = document.getElementById('menu-content');
            
            if (!menuContainer) {
                console.error('❌ Menu container not found!');
                return;
            }
            
            menuContainer.innerHTML = '';
            console.log('📊 Menu categories:', Object.keys(menuData));
            
            Object.entries(menuData).forEach(([categoryId, category]) => {
                console.log(`🍽️ Rendering category: ${categoryId} with ${category.items.length} items`);
                
                const section = document.createElement('section');
                section.id = categoryId;
                section.className = 'category-section';
                
                section.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">${category.title[currentLanguage]}</h2>
                        <p class="section-description">${category.description[currentLanguage]}</p>
                    </div>
                    <div class="row">
                        ${category.items.map((item, index) => createMenuItemCard(item, index)).join('')}
                    </div>
                `;
                
                menuContainer.appendChild(section);
            });
            
            console.log('✅ Menu content rendered successfully');
            
            // Trigger animations after content loads
            setTimeout(observeElementsAnimation, 100);
        }

        // Intersection Observer for scroll animations
        function observeElementsAnimation() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { 
                threshold: 0.1,
                rootMargin: '50px'
            });

            document.querySelectorAll('.category-section, .menu-item-card').forEach(el => {
                observer.observe(el);
            });
        }

        // Setup smooth navigation scrolling
        function setupNavigationScrolling() {
            document.querySelectorAll('.category-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        const offsetTop = targetElement.offsetTop - 120;
                        window.scrollTo({
                            top: offsetTop,
                            behavior: 'smooth'
                        });
                    }
                    
                    // Update active navigation item
                    document.querySelectorAll('.category-link').forEach(nav => nav.classList.remove('active'));
                    link.classList.add('active');
                });
            });
        }

        // Hide preloader after page load
        function hidePreloader() {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 1500);
        }

        // Initialize the application
        function initializeApp() {
            console.log('🚀 Initializing AR Bites Application');
            
            // Hide preloader
            hidePreloader();
            
            // Start model preloading
            preloadModels();
            
            // Render initial content
            renderMenuContent();
            
            // Setup navigation
            setupNavigationScrolling();
            updateNavigationText();
            
            // Setup model loading callbacks
            setTimeout(() => {
                document.querySelectorAll('model-viewer').forEach(viewer => {
                    viewer.addEventListener('load', () => {
                        const loadingOverlay = viewer.querySelector('.loading-overlay');
                        if (loadingOverlay) loadingOverlay.style.display = 'none';
                    });
                });
            }, 1000);
            
            console.log('✅ AR Bites App Ready');
        }

        // Start the application when DOM is ready
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
