        * {

            padding: 0;

        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #2c5530 0%, #1a3a2f 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .logo i {
            font-size: 2rem;
            color: #2c5530;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Language Toggle */
        .language-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            padding: 0.5rem 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .language-toggle:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Category Navigation */
        .category-nav {
            background: white;
            border-radius: 15px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            overflow-x: auto;
            padding: 1rem;
        }

        .category-tabs {
            display: flex;
            gap: 1rem;
            min-width: max-content;
        }

        .category-tab {
            background: #f8f9fa;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #2c5530 0%, #1a3a2f 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(44, 85, 48, 0.3);
        }

        .category-tab:hover:not(.active) {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        /* Menu Grid */
        .menu-section {
            display: none;
        }

        .menu-section.active {
            display: block;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .menu-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 35px rgba(0,0,0,0.15);
        }

        .item-image {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .item-image model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .item-image .placeholder-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c5530 0%, #1a3a2f 100%);
            color: white;
            font-size: 3rem;
        }

        .ar-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .item-content {
            padding: 1.5rem;
        }

        .item-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .item-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .item-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c5530;
            text-align: right;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .category-tabs {
                padding: 0 0.5rem;
            }

            .category-tab {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
            }

            .main-content {
                padding: 1rem;
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

                        name: 'Nabelsi Cheese Manageesh',
                        nameAr: 'مناقيش جبن نابلسي',
                        description: 'Traditional Palestinian cheese manageesh',
                        descriptionAr: 'مناقيش الجبن النابلسي التقليدي',
                        price: 5.75,
                        modelSrc: '/models/manageeshNabelsiCheese.glb'
                    }
                ]
            },
            'traditional': {
                nameEn: 'Traditional',
                nameAr: 'تقليدي',
                icon: 'fas fa-mortar-pestle',
                items: [
                    {
                        id: 'yalanji',
                        name: 'Yalanji (Stuffed Grape Leaves)',
                        nameAr: 'يلنجي (ورق عنب محشي)',
                        description: 'Traditional stuffed grape leaves with rice and herbs',
                        descriptionAr: 'ورق عنب محشي تقليدي بالأرز والأعشاب',
                        price: 8.50,
                        modelSrc: '/models/yalanji'
                    }
                ]
            }
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            initializeCategories();
            updateLanguage();
            selectCategory(currentCategory);
        }

        function initializeCategories() {
            const categoryTabs = document.getElementById('category-tabs');
            categoryTabs.innerHTML = '';

            Object.keys(menuData).forEach(categoryKey => {
                const category = menuData[categoryKey];
                const tab = document.createElement('button');
                tab.className = `category-tab ${categoryKey === currentCategory ? 'active' : ''}`;
                tab.setAttribute('data-category', categoryKey);
                tab.onclick = () => selectCategory(categoryKey);
                
                tab.innerHTML = `
                    <i class="${category.icon}"></i>
                    <span data-en="${category.nameEn}" data-ar="${category.nameAr}">
                        ${currentLanguage === 'ar' ? category.nameAr : category.nameEn}
                    </span>
                `;
                
                categoryTabs.appendChild(tab);
            });
        }

        function selectCategory(categoryKey) {
            currentCategory = categoryKey;
            
            // Update active tab
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-category="${categoryKey}"]`).classList.add('active');
            
            // Hide all menu sections
            document.querySelectorAll('.menu-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show selected category or create it
            let menuSection = document.getElementById(`menu-${categoryKey}`);
            if (!menuSection) {
                menuSection = createMenuSection(categoryKey);
                document.getElementById('menu-container').appendChild(menuSection);
            }
            menuSection.classList.add('active');
        }

        function createMenuSection(categoryKey) {
            const category = menuData[categoryKey];
            const section = document.createElement('div');
            section.className = 'menu-section';
            section.id = `menu-${categoryKey}`;
            
            const menuGrid = document.createElement('div');
            menuGrid.className = 'menu-grid';
            
            category.items.forEach(item => {
                const menuItem = createMenuItemElement(item);
                menuGrid.appendChild(menuItem);
            });
            
            section.appendChild(menuGrid);
            return section;
        }

        function createMenuItemElement(item) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'menu-item';
            
            const hasModel = item.modelSrc && availableModels.includes(item.modelSrc.replace('/models/', ''));
            
            itemDiv.innerHTML = `
                <div class="item-image">
                    ${hasModel ? 
                        `<model-viewer src="${item.modelSrc.replace(/ /g, '%20')}" 
                                      auto-rotate camera-controls 
                                      loading="eager">
                         </model-viewer>
                         <div class="ar-badge">3D AR</div>` :
                        `<div class="placeholder-icon">
                            <i class="fas fa-utensils"></i>
                         </div>`
                    }
                </div>
                <div class="item-content">
                    <h3 class="item-title" data-en="${item.name}" data-ar="${item.nameAr}">
                        ${currentLanguage === 'ar' ? item.nameAr : item.name}
                    </h3>
                    <p class="item-description" data-en="${item.description}" data-ar="${item.descriptionAr}">
                        ${currentLanguage === 'ar' ? item.descriptionAr : item.description}
                    </p>
                    <div class="item-price">${item.price.toFixed(2)} JOD</div>
                </div>
            `;
            
            return itemDiv;
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'ar' : 'en';
            updateLanguage();
            
            // Reinitialize categories with new language
            initializeCategories();
            selectCategory(currentCategory);
        }

        function updateLanguage() {
            // Update all elements with data-en and data-ar attributes
            const elements = document.querySelectorAll('[data-en]');
            elements.forEach(element => {
                const text = currentLanguage === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
                element.textContent = text;
            });
            
            // Update language toggle text
            document.getElementById('language-text').textContent = currentLanguage === 'en' ? 'العربية' : 'English';
            
            // Update document direction
            document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
        }
    </script>
</body>
</html>
