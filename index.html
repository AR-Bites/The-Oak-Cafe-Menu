        :root {
            --primary-color: #1a3a2f;
            --secondary-color: #2d5a4a;
            --accent-color: #d4af37;
            --gold: #d4af37;
            --bg-light: #f8f9fa;
            --text-dark: #333333;
            --text-light: #666666;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --border-radius: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-light);
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><defs><radialGradient id="a" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:white;stop-opacity:0.1"/><stop offset="100%" style="stop-color:white;stop-opacity:0"/></radialGradient></defs><rect width="100" height="20" fill="url(%23a)"/></svg>') repeat;
            opacity: 0.3;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
        }
        
        .tagline {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }
        
        .language-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 3;
        }
        
        .lang-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .lang-btn:hover, .lang-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        /* Navigation */
        .nav-container {
            background: white;
            padding: 1.5rem 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .nav-item {
            background: var(--bg-light);
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        /* Category Section */
        .category-section {
            padding: 4rem 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .category-section.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .category-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .category-title h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .category-title p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        /* Menu Item Card */
        .menu-item {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .menu-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        .model-container {
            height: 250px;
            position: relative;
            background: linear-gradient(135deg, var(--bg-light) 0%, #e9ecef 100%);
            overflow: hidden;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }
        
        .model-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 3rem;
            color: var(--accent-color);
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        
        .item-content {
            padding: 1.5rem;
        }
        
        .item-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .item-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-color);
            flex-grow: 1;
        }
        
        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-left: 1rem;
        }
        
        .item-description {
            color: var(--text-light);
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        
        .item-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--accent-color);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        /* Loading states */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-light);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .language-toggle {
                position: static;
                margin-top: 1rem;
            }
            
            .nav {
                gap: 1rem;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 0.5rem;
            }
            
            .nav-item {
                padding: 0.8rem 1.5rem;
                white-space: nowrap;
                flex-shrink: 0;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .category-title h2 {
                font-size: 2rem;
            }
            
            .container {
                padding: 0 1rem;
            }
        }
        
        /* Arabic RTL Support */
        .rtl {
            direction: rtl;
            text-align: right;
        }
        
        .rtl .item-header {
            flex-direction: row-reverse;
        }
        
        .rtl .item-price {
            margin-left: 0;
            margin-right: 1rem;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Category Icons */
        .category-icon {
            font-size: 1.2rem;
            margin-right: 0.5rem;
        }

            margin-right: 0;
            margin-left: 0.5rem;
        }
    </style>
</head>

        // Available 3D models
        const availableModels = [
            'beefBurger', 'beefFahita', 'Calezone.glb', 'cheeseSteakSandwich',
            'chickenDynamiteSalad', 'chickenFajita', 'chickenQuesadilla', 'chickenShawerma',

            'hallomiSalad', 'halloumiSandwich_', 'hashBrown', 'macAndCheese',
            'manageeshMixCheese.glb', 'manageeshFalafel.glb', 'manageeshMolassesAndTahini.glb',
            'manageeshLabnehandRocca.glb', 'zaatarPomegranate.glb', 'manageeshNabelsiCheese.glb',
            'Margherita Pizza.glb', 'mozzerellaSticks_', 'onionRings_', 'pennaArabita_',
            'Pepperoni Pizza.glb', 'pestoChickenPizza.glb', 'Pesto Pasta.glb', 'Rose Pasta.glb',
            'seaFoodBowl_', 'Sea Food Pasta.glb', 'smokedSalmonSalad', 'Steak',
            'tacoSalad', 'waffleSalad', 'yalanji'
        ];

        let currentLanguage = 'en';
        const modelCache = new Set();

        // Language switching
        function switchLanguage(lang) {
            currentLanguage = lang;
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update body direction
            document.body.classList.toggle('rtl', lang === 'ar');
            
            // Re-render content
            renderMenu();
            updateNavigation();
        }

        // Update navigation text
        function updateNavigation() {
            document.querySelectorAll('.nav-item span').forEach(span => {
                const text = span.getAttribute(`data-${currentLanguage}`);
                if (text) span.textContent = text;
            });
        }

        // Preload 3D models for better performance
        function preloadModels() {
            const preloader = document.createElement('div');
            preloader.style.display = 'none';
            document.body.appendChild(preloader);
            
            availableModels.forEach(modelName => {
                const viewer = document.createElement('model-viewer');
                viewer.setAttribute('src', `models/${modelName}`);
                viewer.setAttribute('preload', '');
                viewer.addEventListener('load', () => {
                    modelCache.add(modelName);
                    console.log(`✅ Cached: ${modelName}`);
                });
                preloader.appendChild(viewer);
            });
        }

        // Create menu item HTML
        function createMenuItem(item, index) {
            const hasModel = item.model && availableModels.includes(item.model);
            
            return `
                <div class="menu-item" style="animation-delay: ${index * 0.1}s">
                    <div class="model-container">
                        ${hasModel ? 
                            `<model-viewer 
                                src="models/${item.model}" 
                                alt="${item.name[currentLanguage]}"
                                auto-rotate 
                                camera-controls 
                                loading="lazy"
                                ar
                                ar-modes="webxr scene-viewer quick-look">
                                <div class="loading-spinner"></div>
                            </model-viewer>` :
                            `<div class="model-fallback">
                                <i class="fas fa-${item.icon}"></i>
                            </div>`
                        }
                    </div>
                    <div class="item-content">
                        <div class="item-header">
                            <h3 class="item-name">${item.name[currentLanguage]}</h3>
                            <span class="item-price">${item.price.toFixed(2)} JOD</span>
                        </div>
                        <p class="item-description">${item.description[currentLanguage]}</p>
                        ${hasModel ? '<div class="item-badge"><i class="fas fa-cube"></i> 3D Model</div>' : ''}
                    </div>
                </div>
            `;
        }

        // Render complete menu
        function renderMenu() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            
            Object.entries(menuData).forEach(([categoryId, category]) => {
                const section = document.createElement('section');
                section.id = categoryId;
                section.className = 'category-section';
                
                section.innerHTML = `
                    <div class="container">
                        <div class="category-title">
                            <h2>${category.title[currentLanguage]}</h2>
                            <p>${category.description[currentLanguage]}</p>
                        </div>
                        <div class="menu-grid">
                            ${category.items.map((item, index) => createMenuItem(item, index)).join('')}
                        </div>
                    </div>
                `;
                
                mainContent.appendChild(section);
            });
            
            // Trigger animations
            setTimeout(observeElements, 100);
        }

        // Intersection Observer for animations
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { 
                threshold: 0.1,
                rootMargin: '50px'
            });

            document.querySelectorAll('.category-section, .menu-item').forEach(el => {
                observer.observe(el);
            });
        }

        // Smooth navigation
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = item.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        const offsetTop = targetElement.offsetTop - 100;
                        window.scrollTo({
                            top: offsetTop,
                            behavior: 'smooth'
                        });
                    }
                    
                    // Update active nav item
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                });
            });
        }

        // Initialize app
        function init() {
            console.log('🚀 Initializing AR Bites App');
            preloadModels();
            renderMenu();
            setupNavigation();
            updateNavigation();
            
            // Performance optimization: Lazy load models
            setTimeout(() => {
                document.querySelectorAll('model-viewer').forEach(viewer => {
                    viewer.addEventListener('load', () => {
                        const spinner = viewer.querySelector('.loading-spinner');
                        if (spinner) spinner.style.display = 'none';
                    });
                });
            }, 1000);
        }

        // Start the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
